[project]
name = "platform-failure-assistant"
version = "0.3.0"
description = "Diagnose Kubernetes and Docker failures in plain language"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3",
    "httpx>=0.27",
    "kubernetes>=31",
    "pydantic>=2.7",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
pfa = "pfa.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs a live kind cluster (run with -m integration)",
    "llm: calls a real AI provider (run with make test-llm)",
    "helm: installs the Helm chart into a local cluster (run with make test-helm)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
