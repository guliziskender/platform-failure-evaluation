workload: {kind: deployment, name: notify-worker}
failure_type: image_pull_backoff
symptom: Pod never starts; status is InvalidImageName.
root_cause: >-
  The image reference busybox:1.36:latest is malformed (it has two tags), so the kubelet
  rejects it without trying to pull.
cause_keywords: ["busybox:1.36:latest"]
fix: Fix the image reference so it has a single tag, e.g. busybox:1.36.
fix_keywords: [[image, tag, reference]]
ready_when: {waiting_reason: [InvalidImageName]}
evidence_must_contain: ["busybox:1.36:latest", "InvalidImageName"]
