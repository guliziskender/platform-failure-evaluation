# payment-gateway points at a binary the image does not contain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment-gateway}
  template:
    metadata:
      labels: {app: payment-gateway}
    spec:
      containers:
        - name: gateway
          image: busybox:1.36
          command: ["/app/payment-gateway", "--listen=:8443"]
