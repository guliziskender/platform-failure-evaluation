# orders-api waits on a database migration init container that fails every time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders-api}
  template:
    metadata:
      labels: {app: orders-api}
    spec:
      initContainers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "applying migration 0042_add_orders_index"
              echo 'ERROR: relation "orders_idx" already exists' >&2
              exit 1
      containers:
        - name: api
          image: busybox:1.36
          command: ["sleep", "3600"]
