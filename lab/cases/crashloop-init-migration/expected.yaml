workload: {kind: deployment, name: orders-api}
failure_type: crash_loop_backoff
symptom: Pod shows Init:CrashLoopBackOff; the main container never starts.
root_cause: >-
  The migrate init container exits 1 because migration 0042 tries to create the index
  orders_idx, which already exists, so the app container never starts.
cause_keywords: [[migrate, init container], [already exists, migration]]
fix: Make migration 0042 idempotent (CREATE INDEX IF NOT EXISTS) or repair the migration state.
fix_keywords: [[migration, migrate, orders_idx]]
ready_when: {restarts_at_least: 2}
evidence_must_contain: ["migrate", "already exists"]
# The rules only point at the error line in its logs; the cause behind it is not pinned down.
rules_confidence: low
