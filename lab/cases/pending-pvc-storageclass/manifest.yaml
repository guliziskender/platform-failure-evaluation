# metrics-store's volume claim asks for a StorageClass the cluster does not have, so the claim
# never binds and the pod is never scheduled.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metrics-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast-ssd
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-store
spec:
  replicas: 1
  selector:
    matchLabels: {app: metrics-store}
  template:
    metadata:
      labels: {app: metrics-store}
    spec:
      containers:
        - name: store
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: metrics-data}
