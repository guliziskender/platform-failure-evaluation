# video-encoder asks for a node label no node in the cluster has.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-encoder
spec:
  replicas: 1
  selector:
    matchLabels: {app: video-encoder}
  template:
    metadata:
      labels: {app: video-encoder}
    spec:
      nodeSelector: {hardware: gpu-a100}
      containers:
        - name: encoder
          image: busybox:1.36
          command: ["sleep", "3600"]
