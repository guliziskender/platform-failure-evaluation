workload: {kind: deployment, name: billing-ui}
failure_type: image_pull_backoff
symptom: Pod never starts; status is ErrImagePull / ImagePullBackOff.
root_cause: >-
  The registry host registry.pfa-lab.invalid cannot be resolved or reached, so the image can
  never be pulled. The tag itself is not the problem.
cause_keywords: [registry]
fix: Correct the registry hostname in the image reference, or fix DNS/network access to it.
fix_keywords: [[registry, hostname, dns, network]]
ready_when: {waiting_reason: [ErrImagePull, ImagePullBackOff]}
evidence_must_contain: ["registry.pfa-lab.invalid", "ErrImagePull"]
# A mirror's 500 does not say whether the registry name or the network is wrong.
rules_confidence: medium
