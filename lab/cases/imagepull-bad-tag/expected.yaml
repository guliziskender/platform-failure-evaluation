workload: {kind: deployment, name: storefront}
failure_type: image_pull_backoff
symptom: Pod never starts; status is ErrImagePull / ImagePullBackOff.
root_cause: >-
  The image tag busybox:1.36.1-uclbic does not exist in the registry (typo of 1.36.1-uclibc),
  so every pull fails with "not found".
cause_keywords: [tag, not found]
fix: Correct the image tag to busybox:1.36.1-uclibc (or another existing tag) and roll out again.
fix_keywords: [tag]
ready_when: {waiting_reason: [ErrImagePull, ImagePullBackOff]}
evidence_must_contain: ["1.36.1-uclbic", "not found", "ErrImagePull"]
