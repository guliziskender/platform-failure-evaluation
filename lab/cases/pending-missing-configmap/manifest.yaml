# email-sender is scheduled but cannot start: the ConfigMap it mounts does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-sender
spec:
  replicas: 1
  selector:
    matchLabels: {app: email-sender}
  template:
    metadata:
      labels: {app: email-sender}
    spec:
      containers:
        - name: sender
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - {name: templates, mountPath: /etc/templates}
      volumes:
        - name: templates
          configMap: {name: email-templates}
