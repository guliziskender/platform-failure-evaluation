# search-api itself is fine: its log-shipper sidecar is the container being OOMKilled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: search-api}
  template:
    metadata:
      labels: {app: search-api}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sleep", "3600"]
        - name: log-shipper
          image: polinux/stress
          # Untagged means re-pulled on every restart; use the cached copy so the lab does not
          # depend on Docker Hub (or Docker Desktop's mirror) being up.
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "log-shipper starting, buffering 200MB of logs in memory"
              exec stress --vm 1 --vm-bytes 200M --vm-hang 0
          resources:
            limits: {memory: 64Mi}
