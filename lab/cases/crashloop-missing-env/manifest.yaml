# checkout-api exits on startup: the Deployment never sets DATABASE_URL.
# DB_PASSWORD holds a fake secret; it must never show up in pfa output. The app also prints
# it in its startup log (a common real-world mistake), so redaction has something to catch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout-api}
  template:
    metadata:
      labels: {app: checkout-api}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "checkout-api v2.4.1 starting"
              echo "loading configuration from environment"
              echo "db config: user=$DB_USER password=$DB_PASSWORD"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: required environment variable DATABASE_URL is not set" >&2
                exit 1
              fi
              exec sleep 3600
          env:
            - {name: DB_USER, value: checkout}
            - {name: DB_PASSWORD, value: pfa-fake-secret-value}
            - {name: LOG_LEVEL, value: info}
