# Ground truth for this broken app, scored by `pfa eval`. A hard case: see `trap`.
workload: {kind: deployment, name: cart-service}
failure_type: crash_loop_backoff
difficulty: hard
rules_confidence: medium
trap: >-
  Two containers in one pod fail for two unrelated reasons. Fixing only the one a diagnosis
  names leaves the pod crashing, so the answer must name both.
symptom: Pod restarts over and over and sits in CrashLoopBackOff.
root_cause: >-
  The api container exits because REDIS_URL is not set, and the worker container exits because
  its config file /etc/cart/worker.yaml does not exist (nothing is mounted there).
cause_keywords: [REDIS_URL, worker.yaml]
fix: >-
  Set REDIS_URL on the api container, and mount the worker's config (e.g. a ConfigMap with
  worker.yaml at /etc/cart).
fix_keywords: [REDIS_URL, worker.yaml]
ready_when: {restarts_at_least: 2}
# Both containers' logs, whichever of the two pfa picks first (it depends on which crashed last).
evidence_must_contain: ["REDIS_URL", "worker.yaml", ": previous container ==="]
