# session-cache starts fine and only hits its limit after its cache warms up.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: session-cache
spec:
  replicas: 1
  serviceName: session-cache
  selector:
    matchLabels: {app: session-cache}
  template:
    metadata:
      labels: {app: session-cache}
    spec:
      containers:
        - name: cache
          image: polinux/stress
          command: ["sh", "-c"]
          args:
            - |
              for mb in 50 100 150 200; do echo "cache warmup: ${mb}MB loaded"; sleep 2; done
              echo "cache warmup: loading remaining 100MB"
              exec stress --vm 1 --vm-bytes 300M --vm-hang 0
          resources:
            limits: {memory: 200Mi}
