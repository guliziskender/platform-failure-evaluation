# Every push and pull request: lint, unit tests, chart tests and the rules eval (checks), then the
# lab, the integration tests, a Helm install and a live eval on a kind cluster (cluster).
# Pushes to master publish the image as :edge; a v* tag publishes :<version> and the chart.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.24"
  HELM_VERSION: "v4.3.1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/pfa

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Chart lint
        run: helm lint deploy/helm/pfa
      - name: Unit tests (incl. the chart's RBAC and security checks)
        run: uv run pytest
      - name: Eval, rules on saved evidence (must stay at 100%)
        run: uv run pfa eval --no-llm --no-save --fail-under 100

  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: pfa-ci
      - run: uv sync --locked
      - name: Lab up (every case broken the way its expected.yaml says)
        run: uv run python lab/lab.py up --timeout 300
      - name: Integration tests and Helm install
        env:
          REQUIRE_CLUSTER: "1"  # a missing cluster, lab or tool fails instead of skipping
        run: uv run pytest -m "integration and not llm" -v
      - name: Eval, rules on live evidence (must stay at 100%)
        run: uv run pfa eval --no-llm --live --no-save --fail-under 100
      - name: Cluster state on failure
        if: failure()
        run: |
          uv run python lab/lab.py status || true
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -50

  publish:
    needs: [checks, cluster]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the project and chart versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          chart=$(sed -n 's/^version: //p' deploy/helm/pfa/Chart.yaml)
          app=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/pfa/Chart.yaml)
          echo "tag $want, pyproject $project, chart $chart, appVersion $app"
          [ "$project" = "$want" ] && [ "$chart" = "$want" ] && [ "$app" = "$want" ]
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=master
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=pfa
            org.opencontainers.image.description=Platform Failure Assistant: diagnoses failing Kubernetes pods with read-only access
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Publish the chart (oci://ghcr.io/<owner>/charts/pfa)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/pfa -d dist
          helm push dist/pfa-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
