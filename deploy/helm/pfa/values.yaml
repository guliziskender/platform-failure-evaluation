# Platform Failure Assistant (pfa). Read-only by design: see templates/rbac.yaml.

image:
  repository: ghcr.io/guliziskender/pfa  # built and published by .github/workflows/ci.yml
  tag: ""  # default: the chart's appVersion
  pullPolicy: IfNotPresent

# The AI layer. Default: no provider, so pfa answers from its rules and nothing leaves the
# cluster.
ai:
  provider: none  # none | anthropic | ollama
  model: ""  # default: claude-opus-5-5 for anthropic, qwen3:8b for ollama
  # Must be true before evidence (redacted) is sent to a hosted model or a non-local Ollama.
  sendData: false
  ollamaUrl: ""  # e.g. http://ollama.ollama.svc:11434
  # The API key comes from a Secret you create; this chart never creates or reads it:
  #   kubectl -n <release namespace> create secret generic pfa-anthropic \
  #     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
  existingSecret: ""
  existingSecretKey: ANTHROPIC_API_KEY
  timeoutSeconds: null  # per AI call; default 30, or 120 for ollama

# What pfa may read. Only get/list/watch on pods, pods/log, events, persistentvolumeclaims,
# deployments, replicasets and statefulsets. Never Secrets, never any write.
rbac:
  create: true
  # cluster: one ClusterRole, pfa can diagnose any namespace.
  # namespaces: a Role in each namespace listed below, for teams that refuse cluster-wide access.
  scope: cluster
  namespaces: []

serviceAccount:
  create: true
  name: ""  # default: the release's full name

# A small idle pod to run diagnoses in:
#   kubectl -n <release namespace> exec deploy/<release> -- pfa diagnose <name> -n <namespace>
toolbox:
  enabled: true

# Or a one-off Job that diagnoses one workload and exits; read it with kubectl logs.
diagnose:
  name: ""  # pod, deployment or statefulset; empty = no Job
  namespace: default
  kind: ""  # pod | deployment | statefulset; empty = auto-detect
  output: text  # text | json | markdown
  noLlm: false
  ttlSecondsAfterFinished: 3600

# Optional NetworkPolicy for pfa's pods: no inbound traffic at all (pfa serves nothing), and
# outbound only to DNS, the Kubernetes API server and, if a provider is set, the AI provider.
# Needs a network plugin that enforces NetworkPolicy (Calico, Cilium, recent kindnet, ...).
networkPolicy:
  enabled: false
  apiServer:
    # Required when enabled. Policies see the API server's real address, not the kubernetes
    # Service IP:
    #   kubectl get endpointslice -n default -l kubernetes.io/service-name=kubernetes \
    #     -o jsonpath='{.items[0].endpoints[*].addresses[*]}'
    cidrs: []  # e.g. [172.18.0.3/32]
    ports: [443, 6443]
  dns:
    namespaceSelector: {kubernetes.io/metadata.name: kube-system}
    podSelector: {k8s-app: kube-dns}
  # Where AI traffic may go. NetworkPolicy cannot filter by hostname, so the default for
  # anthropic is any address on 443; narrow it with ipBlocks or an egress proxy's selector.
  # For ollama: the port in ai.ollamaUrl, to any address unless set here.
  aiTo: []
  extraEgress: []  # more egress rules, as written in a NetworkPolicy

resources:
  requests: {cpu: 10m, memory: 96Mi}
  limits: {memory: 256Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}

nodeSelector: {}
tolerations: []
affinity: {}
